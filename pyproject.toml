[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tslab"
version = "0.1.0"
description = "Time series model selection: linear regression vs. ARIMA, by Adjusted R^2 and AIC"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["tslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
